name = "aid-protocol"
main = "index.js"
compatibility_date = "2026-06-01"

# Production apex serves the branded coming-soon + the tester whitelist.
# The full app runs at dev.aidprotocol.org (separate worker).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "aid-protocol-dev"
database_id = "8236b47a-0857-4669-85a2-4d4914157cc9"

[[kv_namespaces]]
binding = "KV"
id = "edc92ccfd094405da105a7eecc2bc617"

[[routes]]
pattern = "aidprotocol.org"
custom_domain = true
