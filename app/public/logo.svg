<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" fill="none" role="img" aria-label="Aid Protocol">
  <defs>
    <linearGradient id="aidGrad" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#0b5cf7"/>
      <stop offset="0.5" stop-color="#0298d8"/>
      <stop offset="1" stop-color="#19d39f"/>
    </linearGradient>
  </defs>

  <!-- mark: two overlapping rounded peaks forming an A, with hollow ring nodes -->
  <g transform="translate(30,18)">
    <path d="M24 76 L118 16 L200 76" stroke="url(#aidGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 76 L178 44 L276 76" stroke="url(#aidGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="76" r="8" fill="none" stroke="#0b5cf7" stroke-width="6"/>
    <circle cx="284" cy="76" r="8" fill="none" stroke="#19d39f" stroke-width="6"/>
  </g>

  <!-- wordmark -->
  <text x="180" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
    <tspan font-size="42" font-weight="700" letter-spacing="2" fill="#0e1726">AID</tspan><tspan font-size="42" font-weight="300" letter-spacing="6" fill="#5b6675"> PROTOCOL</tspan>
  </text>
  <text x="180" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="500" letter-spacing="3" fill="#8a94a3">LIFELINE FOR HUMANITY · POWERED BY CRYPTO</text>
</svg>
